<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Lyrics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0d0d14;
      color: #fff;
      overflow: hidden;
    }

    .header {
      padding: 18px 20px 16px;
      background: linear-gradient(135deg, #1c1c2e 0%, #151528 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #ff3377, #9933ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(255, 51, 119, 0.35);
    }

    .header-icon svg { display: block; }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .header-text p {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
    }

    .body {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .toggle-label { font-size: 13px; font-weight: 600; }
    .toggle-sub   { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .ios-toggle { position: relative; display: inline-block; width: 46px; height: 26px; }
    .ios-toggle input { opacity: 0; width: 0; height: 0; }
    .ios-toggle .slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.18);
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.25s;
    }
    .ios-toggle .slider::before {
      content: '';
      position: absolute;
      height: 20px; width: 20px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .ios-toggle input:checked + .slider {
      background: linear-gradient(135deg, #ff3377, #9933ff);
    }
    .ios-toggle input:checked + .slider::before {
      transform: translateX(20px);
    }

    /* Track status card */
    .now-playing {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .now-playing-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 8px;
    }
    .track-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shortcut-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, rgba(255, 51, 119, 0.18), rgba(153, 51, 255, 0.18));
      border: 1px solid rgba(255, 51, 119, 0.3);
      border-radius: 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .open-btn:hover {
      background: linear-gradient(135deg, rgba(255, 51, 119, 0.3), rgba(153, 51, 255, 0.3));
    }

    .footer {
      padding: 10px 20px 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Apple Music Lyrics</h1>
      <p>Multi-source engine · v2.0</p>
    </div>
  </div>

  <div class="body">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Lyrics Page</div>
        <div class="toggle-sub">Fullscreen synced view</div>
      </div>
      <label class="ios-toggle">
        <input type="checkbox" id="lyricsToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="now-playing">
      <div class="now-playing-label">Now Playing</div>
      <div class="track-name" id="trackName">—</div>
      <div class="track-artist" id="trackArtist">Open YouTube Music to start</div>
    </div>

    <div class="shortcut-hint">
      <span>Keyboard Shortcut</span>
      <span class="kbd">L</span>
    </div>

    <a class="open-btn" href="https://music.youtube.com" target="_blank" id="openYTM">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
      </svg>
      Open YouTube Music
    </a>
  </div>

  <div class="footer">
    <span>Multi-source: 13 providers · BitChord engine</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
